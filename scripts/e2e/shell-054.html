<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0">
<iframe id="dsh-frame" style="width:100vw;height:100vh;border:0" allow="clipboard-write" src=""></iframe>
<script>
  const PROXY_URL = "http://127.0.0.1:54739/";
  const iframeEl = document.getElementById('dsh-frame');
  const iframeSrc = PROXY_URL;
  const ALLOWED_ORIGIN = new URL(PROXY_URL).origin;
  let bridgeAcked = false, ackResult = null, helloCount = 0;
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (e.origin !== ALLOWED_ORIGIN || e.source !== iframeEl.contentWindow) return;
    if (d && d.kind === 'bridgeAck') { bridgeAcked = true; ackResult = d; }
  });
  iframeEl.src = iframeSrc;
  iframeEl.addEventListener('load', () => {
    let helloAttempts = 0;
    const sendHello = () => {
      helloCount++;
      if (!bridgeAcked && iframeEl.contentWindow) {
        iframeEl.contentWindow.postMessage({ kind: 'bridgeHello', token: 'shell-probe-token', imageFallback: false }, iframeSrc);
      }
    };
    sendHello();
    const helloRetry = setInterval(() => {
      helloAttempts += 1;
      if (bridgeAcked || helloAttempts > 60) { clearInterval(helloRetry); return; }
      sendHello();
    }, 500);
  });
  window.__shellState = () => ({ bridgeAcked, ackResult, helloCount });
</script>
</body></html>
